<head>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
	<link href="css/bulma.css" rel="stylesheet">
	<link href="css/styles.css" rel="stylesheet">
		
	<script src="js/LightCore.js" defer></script>
	<script src="js/changelogs.js" defer></script>
	<script src="js/dict.js" defer></script>
	<script src="js/index.js" defer></script>
	<script src="js/settings.js" defer></script>
	<script src="js/unpacker.js" defer></script>
	<script src="js/toast.js" defer></script>
</head>


<body>
	<div class="pane topPane flex">
	
		<span class="Extension version"></span>
		<div class="translateCenter flex topPaneTitle">
			<img class="patPatLoader" src="../OmniTools_128x128.png">
			<span class="Extension Name"> Omni Tools </span>
		</div>
		
	</div>
	
	
	<div class="SettingsDiv flex">
	
		<div class="pane leftPane flex">
			<div class="topOne flex">
				
				<div class="General active" SettingLinkedTo="General">
					<img src="icons/general.svg">
					<span data-i18n="GeneralSettings"> General Settings <span>
				</div>
				
				<div class="ServerChoose" SettingLinkedTo="ServerChoose">
					<img src="icons/servers.svg">
					<span data-i18n="ServerChoise"> Data Set <span>
				</div>
				
				<div class="BlockList" SettingLinkedTo="BlockList">
					<img src="icons/block.svg">
					<span data-i18n="BlockList"> Block List <span>
				</div>
			</div>
			
			<div class="bottomOne">
			
				<div class="OtherTab" SettingLinkedTo="OtherTab">
					<img src="icons/more.svg">
					<span data-i18n="OtherTab"> Other <span>
				</div>
							
				<div class="AuthorsTab" SettingLinkedTo="AuthorsTab">
					<div class="avatarlist">
						<img src="https://avatars.githubusercontent.com/u/99125366" loading="lazy">
					</div>
					
					
					<span data-i18n="AuthorsTab" class="AuthorsTabText"><span>
				</div>
				
				
				
			</div>
		</div>
		
		<div class="pane settingsPane flex"></div>
		
	</div>
	
	
	
</body>
